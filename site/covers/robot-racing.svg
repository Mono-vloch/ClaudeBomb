<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="A robot on a race track">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24E0C0"/>
      <stop offset="1" stop-color="#0E3556"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#24E0C0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#24E0C0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="#0B1536"/>
  <!-- the track: two rounded loops, seen from above -->
  <rect x="200" y="160" width="1200" height="680" rx="340" fill="none" stroke="#0E3556" stroke-width="150"/>
  <rect x="200" y="160" width="1200" height="680" rx="340" fill="none" stroke="#24E0C0" stroke-width="4" stroke-dasharray="26 22" opacity="0.55"/>
  <rect x="275" y="235" width="1050" height="530" rx="265" fill="none" stroke="#16C2B0" stroke-width="2" opacity="0.35"/>
  <rect x="125" y="85" width="1350" height="830" rx="415" fill="none" stroke="#16C2B0" stroke-width="2" opacity="0.35"/>
  <!-- start line -->
  <g transform="translate(800 160)">
    <rect x="-6" y="-75" width="12" height="150" fill="#F5F7F8" opacity="0.9"/>
    <rect x="-6" y="-75" width="12" height="30" fill="#0B1536"/>
    <rect x="-6" y="-15" width="12" height="30" fill="#0B1536"/>
    <rect x="-6" y="45" width="12" height="30" fill="#0B1536"/>
  </g>
  <!-- rewards along the way -->
  <g fill="#24E0C0" opacity="0.9">
    <circle cx="1130" cy="190" r="10"/>
    <circle cx="1340" cy="330" r="10"/>
    <circle cx="1380" cy="560" r="10"/>
    <circle cx="1210" cy="800" r="10"/>
    <circle cx="560" cy="820" r="10"/>
    <circle cx="300" cy="640" r="10"/>
  </g>
  <!-- the robot, mid-corner, with a glow -->
  <g transform="translate(1335 460) rotate(28)">
    <circle r="150" fill="url(#glow)"/>
    <rect x="-52" y="-62" width="104" height="124" rx="26" fill="url(#g)"/>
    <rect x="-36" y="-40" width="72" height="34" rx="12" fill="#0B1536"/>
    <circle cx="-14" cy="-23" r="6" fill="#63FFF3"/>
    <circle cx="14" cy="-23" r="6" fill="#63FFF3"/>
    <rect x="-20" y="18" width="40" height="8" rx="4" fill="#0B1536" opacity="0.6"/>
    <rect x="-62" y="-30" width="12" height="40" rx="6" fill="#0E3556"/>
    <rect x="50" y="-30" width="12" height="40" rx="6" fill="#0E3556"/>
  </g>
  <!-- the lap it has learned so far -->
  <path d="M 800 160 C 1000 160, 1200 170, 1330 280" fill="none" stroke="#63FFF3" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
</svg>
