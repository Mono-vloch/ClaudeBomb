<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="A corridor of locked doors">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24E0C0"/>
      <stop offset="1" stop-color="#0E3556"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E3556" stop-opacity="0"/>
      <stop offset="1" stop-color="#0E3556" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#24E0C0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#24E0C0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="#0B1536"/>
  <!-- corridor perspective -->
  <polygon points="0,1000 1600,1000 1100,520 500,520" fill="url(#floor)"/>
  <line x1="0" y1="1000" x2="500" y2="520" stroke="#16C2B0" stroke-width="2" opacity="0.35"/>
  <line x1="1600" y1="1000" x2="1100" y2="520" stroke="#16C2B0" stroke-width="2" opacity="0.35"/>
  <line x1="500" y1="520" x2="1100" y2="520" stroke="#16C2B0" stroke-width="2" opacity="0.35"/>
  <!-- doors receding down the left wall -->
  <g fill="#0E3556">
    <polygon points="120,230 300,290 300,840 120,920"/>
    <polygon points="380,320 500,360 500,760 380,810"/>
  </g>
  <g fill="#F5F7F8" opacity="0.5">
    <circle cx="270" cy="570" r="7"/>
    <circle cx="480" cy="565" r="5"/>
  </g>
  <!-- doors down the right wall -->
  <g fill="#0E3556">
    <polygon points="1480,230 1300,290 1300,840 1480,920"/>
    <polygon points="1220,320 1100,360 1100,760 1220,810"/>
  </g>
  <g fill="#F5F7F8" opacity="0.5">
    <circle cx="1330" cy="570" r="7"/>
    <circle cx="1120" cy="565" r="5"/>
  </g>
  <!-- the exit at the end, lit -->
  <circle cx="800" cy="440" r="260" fill="url(#glow)"/>
  <rect x="700" y="320" width="200" height="300" rx="14" fill="#0B1536" stroke="url(#g)" stroke-width="8"/>
  <rect x="716" y="336" width="168" height="268" rx="8" fill="#0E3556"/>
  <!-- the keypad on the exit -->
  <g fill="#24E0C0">
    <circle cx="862" cy="430" r="7"/>
    <circle cx="862" cy="458" r="7"/>
    <circle cx="862" cy="486" r="7"/>
  </g>
  <!-- the padlock, open -->
  <g transform="translate(800 470)">
    <rect x="-40" y="-10" width="80" height="64" rx="12" fill="url(#g)"/>
    <path d="M -24 -10 V -34 A 24 24 0 0 1 24 -34 V -22" fill="none" stroke="#63FFF3" stroke-width="10" stroke-linecap="round"/>
    <circle cy="20" r="9" fill="#0B1536"/>
  </g>
</svg>
