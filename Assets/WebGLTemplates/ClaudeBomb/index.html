<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}} - Maaloomatiia Academy</title>
    <link rel="icon" type="image/png" href="maaloomatiia-emblem.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      /* A Maaloomatiia cover, as the game's own title screen (Assets/Scripts/Ui.cs):
         Deep Knowledge Blue, the full wordmark, teal on navy for the highlight. */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1536; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #0b1536; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
                 color: #ffffff; font: 400 16px/1.5 Inter, system-ui, sans-serif; transition: opacity 0.6s;
                 background: linear-gradient(135deg, #0b1536 0%, #0b1536 55%, #0e3556 100%); }
      #loading .logo { width: min(260px, 60vw); height: auto; margin-bottom: 8px; }
      #loading .kicker { color: #9eaebb; font-weight: 500; font-size: 12px; letter-spacing: 0.12em; }
      #loading h1 { margin: 0; font-weight: 700; font-size: clamp(44px, 9vw, 96px); line-height: 1; text-align: center; }
      #loading h1 span { color: #24e0c0; }
      #loading small { color: #9eaebb; font-size: 14px; }
      #bar { width: min(360px, 80vw); height: 4px; background: #0e3556; border-radius: 2px; overflow: hidden; }
      #fill { width: 0%; height: 100%; background: #24e0c0; transition: width 0.2s; }
      #banner { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px; font: 14px system-ui, sans-serif; color: #fff; background: #a33; display: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <img class="logo" src="maaloomatiia-logo.png" alt="Maaloomatiia">
      <div class="kicker">NIGHT SHIFT / BAY 3</div>
      <h1>Claude <span>Bomb</span></h1>
      <div id="bar"><div id="fill"></div></div>
      <small>Loading. The first time can take a minute, and it's best with sound on.</small>
    </div>
    <div id="banner"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      // Right-drag rotates the bomb, so the browser's right-click menu must stay closed.
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

      function showBanner(msg, type) {
        if (type !== "error") { console.warn(msg); return; }
        var banner = document.querySelector("#banner");
        banner.textContent = msg;
        banner.style.display = "block";
      }

      var buildUrl = "Build";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: showBanner,
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#fill").style.width = (100 * progress) + "%";
        }).then(function () {
          var loading = document.querySelector("#loading");
          loading.style.opacity = "0";
          setTimeout(function () { loading.style.display = "none"; }, 600);
          canvas.focus();
        }).catch(function (message) {
          showBanner(String(message), "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
